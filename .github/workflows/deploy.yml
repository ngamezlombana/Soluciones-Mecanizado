name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Configure base path for GitHub Pages
        run: |
          sed -i "s|output: 'static',|base: '/Soluciones-Mecanizado', output: 'static',|g" astro.config.mjs
          sed -i 's|href="/|href="/Soluciones-Mecanizado/|g' src/layouts/Layout.astro src/components/*.astro src/pages/*.astro
          sed -i 's|src="/|src="/Soluciones-Mecanizado/|g' src/components/*.astro
          sed -i "s|url('/|url('/Soluciones-Mecanizado/|g" src/components/*.astro
          sed -i 's|url("/fonts/|url("/Soluciones-Mecanizado/fonts/|g' public/fonts/fonts.css
      - name: Build with Astro
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
